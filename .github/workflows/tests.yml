# Continuous Integration: GitHub runs the test suite automatically on every
# pull request into dev or main, and on every push to those branches.
# A red X on the pull request means a test failed and the PR should not be merged.
name: Tests

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.12 is a widely used version (and an option on Streamlit Cloud);
        # 3.14 matches the local development environment.
        python-version: ["3.12", "3.14"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v
